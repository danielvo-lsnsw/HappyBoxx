name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "global.json"
      - "Directory.Packages.props"
      - "src/BuildingBlocks/**"
      - "src/Aspire/HappyBoxx.ServiceDefaults/**"
      - "src/Services/Identity/**"
      - "src/Services/Catalog/**"
      - "src/Services/Inventory/**"
      - "src/Services/Billing/**"
      - "src/Gateway/**"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and publish APIs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - artifact: identity
            project: src/Services/Identity/HappyBoxx.Identity.Api/HappyBoxx.Identity.Api.csproj
          - artifact: catalog
            project: src/Services/Catalog/HappyBoxx.Catalog.Api/HappyBoxx.Catalog.Api.csproj
          - artifact: inventory
            project: src/Services/Inventory/HappyBoxx.Inventory.Api/HappyBoxx.Inventory.Api.csproj
          - artifact: billing
            project: src/Services/Billing/HappyBoxx.Billing.Api/HappyBoxx.Billing.Api.csproj
          - artifact: gateway
            project: src/Gateway/HappyBoxx.Gateway/HappyBoxx.Gateway.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ matrix.app.project }}

      - name: Publish
        run: dotnet publish ${{ matrix.app.project }} -c Release -o ${{ runner.temp }}/publish/${{ matrix.app.artifact }} --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ runner.temp }}/publish/${{ matrix.app.artifact }}
          if-no-files-found: error

  deploy-identity:
    name: Deploy Identity API
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: identity
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Identity API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_IDENTITY }}
          package: publish

  deploy-catalog:
    name: Deploy Catalog API
    runs-on: ubuntu-latest
    needs: deploy-identity
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Catalog API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_CATALOG }}
          package: publish

  deploy-inventory:
    name: Deploy Inventory API
    runs-on: ubuntu-latest
    needs: deploy-identity
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: inventory
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Inventory API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_INVENTORY }}
          package: publish

  deploy-billing:
    name: Deploy Billing API
    runs-on: ubuntu-latest
    needs: deploy-identity
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: billing
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Billing API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_BILLING }}
          package: publish

  deploy-gateway:
    name: Deploy Gateway
    runs-on: ubuntu-latest
    needs:
      - deploy-catalog
      - deploy-inventory
      - deploy-billing
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gateway
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Gateway
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_GATEWAY }}
          package: publish
